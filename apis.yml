aid: lumafield
name: Lumafield
description: >-
  Lumafield is a manufacturing technology company that builds accessible industrial X-ray
  computed tomography (CT) scanning hardware and AI-powered cloud analysis software. Its
  Neptune and Triton scanners pair with the Voyager cloud platform so engineers and
  manufacturers can inspect the inside of parts non-destructively, measure dimensions and
  GD&T against CAD, detect porosity, cracks, inclusions and wall-thickness defects, and
  automate inspection at production volume. Lumafield delivers CT as a unified hardware,
  cloud, and analytics system rather than a public developer API; this profile catalogs its
  public developer-adjacent surfaces (support/knowledge base, release notes, and an
  llms.txt documentation index) for the API Evangelist network.
